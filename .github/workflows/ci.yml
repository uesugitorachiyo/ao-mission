name: ci
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.4'
      - shell: bash
        run: '[ "$(go env GOVERSION)" = "go1.26.4" ]'
      - run: go test ./... -count=1
      - run: go vet ./...
      - run: go build ./cmd/ao-mission
