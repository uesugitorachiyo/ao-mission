name: ci
on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.4'
      - shell: bash
        run: '[ "$(go env GOVERSION)" = "go1.26.4" ]'
      - name: Run test suite with bounded diagnostics
        shell: pwsh
        run: |
          $helper = Join-Path $env:RUNNER_TEMP 'ao-mission-ci-go-test'
          if ($IsWindows) { $helper += '.exe' }
          go build -o $helper ./scripts/ci-go-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $childExit = $null
          $global:LASTEXITCODE = $null
          try {
          & $helper
          $commandSucceeded = $?
          $childExit = $LASTEXITCODE
          } catch {
          Write-Error 'CI test helper failed to launch'
          exit 1
          }
          if ($null -eq $childExit) { exit 1 }
          if ($commandSucceeded -ne ($childExit -eq 0)) { exit 1 }
          exit $childExit
      - run: go vet ./...
      - run: go build ./cmd/ao-mission
